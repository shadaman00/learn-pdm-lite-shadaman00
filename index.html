<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>설비 진동 추세</title>
<style>
body{margin:0;padding:16px;font-family:system-ui,sans-serif;background:#fff;color:#1a1a1a}
h1{font-size:1.2rem;margin:0 0 8px}svg{width:100%;height:auto;display:block}
p{font-size:.85rem;color:#555;margin:6px 0}
</style></head><body>
<h1>설비 A·B 진동(mm/s) 시간순 추이</h1>
<svg id="c" viewBox="0 0 640 360" role="img" aria-label="설비 A와 B의 진동 선그래프"></svg>
<p><b>추세 시작(추정):</b> 설비 B, 2026-09-15 13:40 (초반 10점 평균+2σ=1.09 첫 초과). 15:00부터 뚜렷한 상승. 설비 A의 12:40 = 3.5는 한 번 튀고 복귀한 노이즈.</p>
<p>가상 데이터 · 출처: keerhee/kma-auto-genai-3-1, data/Day5</p>
<script>
const A=[0.99,1.05,0.92,0.93,1.05,1.0,0.93,0.96,0.93,0.96,1.06,1.0,1.1,0.9,3.5,1.0,1.04,0.94,1.06,1.06,1.02,1.03,0.99,0.93,1.03];
const B=[0.94,1.05,1.03,1.03,1.05,1.0,1.05,1.01,1.01,0.96,1.02,1.01,1.04,1.04,1.06,1.05,1.08,1.1,1.12,1.09,1.0,1.3,1.7,2.2,2.9];
const hh=i=>{const m=480+i*20;return String(m/60|0).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const W=640,H=360,L=44,R=12,T=16,Bt=44,max=4,x=i=>L+i*(W-L-R)/24,y=v=>T+(1-v/max)*(H-T-Bt);
let s='';
for(let v=0;v<=4;v++)s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#ddd"/><text x="${L-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="#555">${v}</text>`;
for(let i=0;i<25;i+=4)s+=`<text x="${x(i)}" y="${H-Bt+16}" font-size="11" text-anchor="middle" fill="#555">${hh(i)}</text>`;
const line=(d,c)=>`<polyline fill="none" stroke="${c}" stroke-width="2" points="${d.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`;
s+=line(A,'#2a6fdb')+line(B,'#d9480f');
s+=`<line x1="${x(17)}" x2="${x(17)}" y1="${T}" y2="${H-Bt}" stroke="#d9480f" stroke-dasharray="4 3"/><text x="${x(17)-4}" y="${T+10}" font-size="11" text-anchor="end" fill="#d9480f">B 추세 시작 13:40</text>`;
s+=`<circle cx="${x(14)}" cy="${y(3.5)}" r="4" fill="#2a6fdb"/><text x="${x(14)+8}" y="${y(3.5)+4}" font-size="11" fill="#2a6fdb">A 노이즈 3.5</text>`;
s+=`<text x="${L+8}" y="${H-8}" font-size="12" fill="#2a6fdb">━ 설비A</text><text x="${L+80}" y="${H-8}" font-size="12" fill="#d9480f">━ 설비B</text>`;
document.getElementById('c').innerHTML=s;
</script></body></html>
